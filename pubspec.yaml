name: zerotrust_privacy
description: "Zero-Trust Privacy: see how private your phone is, and what to fix first."
publish_to: none
version: 0.4.0+4

environment:
  sdk: ^3.10.7
  flutter: ">=3.38.6"

# Builds SQLite3MultipleCiphers instead of plain SQLite, so the core's local
# store is encrypted as a whole file (see Zero-Trust-Core README, "Sync").
hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Shared account, keys, sync, settings and look of every Zero-Trust app.
  # Never add cryptography_flutter: it breaks the core's key derivation.
  zero_trust_core:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zero_trust_core
      ref: v1.0.1
  flutter_riverpod: ^3.5.0
  supabase_flutter: ^2.9.0
  # Reset links from account emails (IncomingLinks).
  app_links: ">=6.4.0 <8.0.0"
  flutter_dotenv: ^6.0.1
  intl: any
  url_launcher: ^6.3.1
  # Hands the exported data file to the system share sheet.
  share_plus: ^13.3.1
  # The app's own folder, for the tracker scan results kept on the phone.
  path_provider: ^2.1.5

dev_dependencies:
  # The suite's release checks, run by the build before every release. This
  # package does not depend on the core, so it can be newer than the core
  # pin above: this commit has the zero-tracker check.
  zt_release_checks:
    git:
      url: https://github.com/EdoSag/Zero-Trust-Core.git
      path: packages/zt_release_checks
      ref: b9b9226e5997386da964bc3ef4ad86a8424e3938
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - .env
    # Exodus Privacy's tracker list (ODbL 1.0), see assets/trackers/NOTICE.md.
    - assets/trackers/exodus_trackers.json
    - assets/trackers/NOTICE.md
