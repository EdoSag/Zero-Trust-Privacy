# Builds a signed release APK on every push to main and publishes it as a
# GitHub Release, so the app can be downloaded and installed without Google
# Play. Pull requests get the same build as a downloadable artifact (no
# release), which shows a change still builds before it is merged.
#
# One-time setup (Settings > Secrets and variables > Actions > New secret):
#   ANDROID_KEYSTORE_BASE64   the release keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD its password (store and key use the same one)
# Every build must be signed with the same keystore, or Android refuses to
# install an update over the previous version.
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_SLUG: zero-trust-privacy
  APP_TITLE: Zero-Trust Privacy

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A throwaway database for the release checks below.
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned: Flutter 3.50 deprecates package:flutter/material.dart, which
          # fails analyze. Same version as Zero-Trust-Core CI.
          flutter-version: 3.47.9
          cache: true

      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/codemagic.keystore"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Lets a PR still prove the app builds; this APK will not install
            # over a released one. Releases never use a throwaway key.
            echo "::warning::Signing secrets not set; signing this PR build with a throwaway key."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16)
            echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -keystore "$RUNNER_TEMP/codemagic.keystore" -storetype PKCS12 \
              -alias zerotrust -keyalg RSA -keysize 2048 -validity 1 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" -dname "CN=PR build"
          else
            echo "::error::Missing signing secrets. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD under Settings > Secrets and variables > Actions."
            exit 1
          fi
          # android/app/build.gradle.kts reads these (shared names across the apps).
          {
            echo "CM_BUILD_DIR=$RUNNER_TEMP"
            echo "CM_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "CM_KEY_ALIAS=zerotrust"
            echo "CM_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Drop machine-specific Gradle settings
        # A local org.gradle.java.home (e.g. a Windows Android Studio path)
        # breaks the Linux runner; setup-java provides the JDK here.
        run: sed -i '/^org\.gradle\.java\.home=/d' android/gradle.properties

      - name: Cache the Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle-dist
          key: gradle-dist-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Fetch Gradle with retries
        # The wrapper's own download has no retry, and GitHub's release
        # downloads sometimes answer 504. Fetch it once with retries, keep it
        # cached, and point the wrapper at the local file.
        run: |
          PROPS=android/gradle/wrapper/gradle-wrapper.properties
          URL=$(sed -nE 's/^distributionUrl=(.*)/\1/p' "$PROPS" | sed 's/\\:/:/g')
          FILE="$HOME/.gradle-dist/$(basename "$URL")"
          mkdir -p "$HOME/.gradle-dist"
          if [ ! -s "$FILE" ]; then
            curl -fsSL --retry 6 --retry-all-errors --retry-delay 20 -o "$FILE" "$URL"
          fi
          sed -i "s#^distributionUrl=.*#distributionUrl=file\\:$FILE#" "$PROPS"

      - name: Write .env when it is not committed
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          if [ -f .env ]; then
            echo "Using the .env committed in the repository."
          elif [ -n "$ENV_FILE" ]; then
            printf '%s\n' "$ENV_FILE" > .env
            echo "Wrote .env from the ENV_FILE secret."
          else
            # Public client values (the Supabase URL and publishable key ship
            # inside every APK anyway). Set an ENV_FILE secret to override.
            cat > .env <<'ENVEOF'
          SUPABASE_URL=https://ohgxpnchqmisvktqjmcx.supabase.co
          SUPABASE_ANON_KEY=sb_publishable_C1geAnwr0LZSxfQKRg21YA_G-OXHYky
          ENVEOF
            echo "Wrote .env with the shared public Supabase values."
          fi

      - run: flutter pub get

      - name: Release checks
        # Shared by every Zero-Trust app (Zero-Trust-Core,
        # packages/zt_release_checks): key, sync and sign-in vectors run with
        # this app's dependencies, app setup (cryptography_flutter, which
        # breaks sign-in, must never be in the build), and the database
        # rules of the pinned core plus every table and function this app
        # calls. A failure here stops the release.
        env: { PGHOST: localhost, PGUSER: postgres, PGPASSWORD: postgres }
        run: dart run zt_release_checks --app privacy --database

      - name: Analyze and test
        run: |
          flutter analyze
          flutter test test/

      - name: Build the release APK
        run: |
          set -e
          VERSION=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
          # versionCode must grow with every build so updates install over
          # the previous APK; 1000 + run number stays above old pubspec codes.
          BUILD=$((1000 + GITHUB_RUN_NUMBER))
          # 64-bit ARM only: the phones this app supports (Android 9 and
          # later) are 64-bit.
          # ZT_BUILD puts the build number into the app and its results files.
          flutter build apk --release --target-platform android-arm64 --build-number="$BUILD" --dart-define=ZT_BUILD="$BUILD"
          APK="$APP_SLUG-$VERSION-build$BUILD.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK"
          ls -lh "$APK"
          # A privacy app's own permission list must not grow by accident.
          # Every permission in the APK has to be on this list; a library
          # that brings in a new one fails the build until it is looked at
          # and either removed or added here with its reason.
          #   INTERNET, USE_BIOMETRIC, USE_FINGERPRINT: account, sync, unlock
          #   QUERY_ALL_PACKAGES, PACKAGE_USAGE_STATS, GET_APP_OPS_STATS,
          #   QUERY_ADVANCED_PROTECTION_MODE, ACCESS_NETWORK_STATE: the checks
          #   DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION: AndroidX's own guard
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT" dump permissions "$APK" | tee permissions.txt
          ALLOWED="android.permission.INTERNET
          android.permission.USE_BIOMETRIC
          android.permission.USE_FINGERPRINT
          android.permission.QUERY_ALL_PACKAGES
          android.permission.PACKAGE_USAGE_STATS
          android.permission.GET_APP_OPS_STATS
          android.permission.QUERY_ADVANCED_PROTECTION_MODE
          android.permission.ACCESS_NETWORK_STATE
          dev.sagron.zerotrustprivacy.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
          EXTRA=$(sed -nE "s/^uses-permission: name='([^']+)'.*/\1/p" permissions.txt \
            | grep -vxF -f <(printf '%s\n' "$ALLOWED" | sed 's/^ *//') || true)
          if [ -n "$EXTRA" ]; then
            echo "::error::The APK asks for permissions that are not on the list: $(echo $EXTRA)"
            exit 1
          fi
          {
            echo "VERSION=$VERSION"
            echo "BUILD=$BUILD"
            echo "APK=$APK"
          } >> "$GITHUB_ENV"

      - name: No tracker code in our own app
        # The app that looks for tracker code in other apps must have none
        # itself. This reads the class names in the APK just built and
        # compares them with the same Exodus Privacy list the app ships,
        # by the same rules. A dependency that brings a tracker in fails
        # the build here, with the tracker's name and where its code sits.
        run: dart run zt_release_checks:zt_tracker_check "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          retention-days: 14

      - name: Publish the GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION-build$BUILD"
          SUBJECT=$(git log -1 --pretty=%s)
          gh release create "$TAG" "$APK" \
            --target "$GITHUB_SHA" \
            --title "$APP_TITLE $VERSION (build $BUILD)" \
            --notes "Latest change: $SUBJECT

          Download **$APK** below and open it on your phone to install or update. Android may ask you to allow installs from this source the first time." \
            --latest
